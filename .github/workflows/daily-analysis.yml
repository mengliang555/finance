name: 每日分析发布

on:
  schedule:
    # 每天 01:00 UTC = 09:00 Asia/Shanghai（与 scripts/daily_analysis_config.json 保持一致）
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 生成前一致性校验
        run: python scripts/check_consistency.py

      - name: 生成每日分析
        run: python scripts/daily_company_analysis.py

      - name: 生成后一致性校验
        run: python scripts/check_consistency.py

      - name: 构建站点产物
        run: python scripts/build_site.py --out dist

      - name: 上传执行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-analysis-logs
          path: logs/
          if-no-files-found: ignore

      - name: 提交并推送产物
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_analysis reports/daily_analysis docs/reports
          if git diff --cached --quiet; then
            echo "本次运行没有产生变更"
            exit 0
          fi
          git commit -m "chore: publish daily analysis $(date -u +%Y%m%d)"
          git push origin HEAD:main
