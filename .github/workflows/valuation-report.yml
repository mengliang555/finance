name: 工作日估值与仓位建议

on:
  schedule:
    # 周一到周五 02:00 UTC = 10:00 Asia/Shanghai
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valuation-report
  cancel-in-progress: false

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 生成估值报告并更新页面
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/valuation_report.py

      - name: 提交估值页面
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/valuation.html docs/valuation_reports.json
          if [ -d docs/valuation ]; then
            git add docs/valuation
          fi
          if git diff --cached --quiet; then
            echo "估值页面没有变化"
            exit 0
          fi
          git commit -m "chore: publish valuation $(date -u +%Y%m%d)"
          git push origin HEAD:${{ github.ref_name }}

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valuation-report
          path: |
            reports/valuation/
            docs/valuation.html
          if-no-files-found: ignore
